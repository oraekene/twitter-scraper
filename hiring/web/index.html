<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Hiring searches</title>
<style>
  :root { --bg:#111315; --panel:#1a1d21; --line:#2a2e34; --fg:#e6e8ea; --dim:#9aa3ad; --ok:#4ec9a5; --warn:#e2b33c; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI",sans-serif }
  header { padding:18px 24px; border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:baseline }
  h1 { font-size:16px; margin:0; font-weight:600 }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); margin:0 0 10px }
  .wrap { max-width:1100px; margin:0 auto; padding:24px }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:20px }
  table { width:100%; border-collapse:collapse }
  th,td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:top }
  th { color:var(--dim); font-weight:500; font-size:12px; text-transform:uppercase; letter-spacing:.05em }
  code,.mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px }
  button { background:#2b3138; color:var(--fg); border:1px solid var(--line); border-radius:6px;
           padding:5px 10px; cursor:pointer; font-size:12px }
  button:hover { background:#343b43 }
  button.danger:hover { background:#5a2626 }
  input,select { background:#0d0f11; color:var(--fg); border:1px solid var(--line);
                 border-radius:6px; padding:6px 8px; font-size:13px; width:100% }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px }
  label { display:block; font-size:12px; color:var(--dim); margin-bottom:4px }
  .row { display:flex; gap:8px; align-items:center }
  .dim { color:var(--dim) }
  .pill { display:inline-block; padding:1px 7px; border-radius:99px; font-size:11px; border:1px solid var(--line) }
  .on { color:var(--ok); border-color:#235c4a } .off { color:var(--dim) }
  .counts { font-family:ui-monospace,monospace; font-size:12px; color:var(--dim) }
  .tw { border-top:1px solid var(--line); padding:10px 0 }
  .tw .who { color:var(--ok) }
  .tw .txt { color:var(--fg); margin:3px 0 }
  .tw a { color:var(--dim); font-size:12px; text-decoration:none }
  .tw a:hover { text-decoration:underline }
  details > summary { cursor:pointer; color:var(--dim); padding:6px 0 }
  #msg { position:fixed; bottom:16px; right:16px; background:#23282e; border:1px solid var(--line);
         padding:9px 14px; border-radius:6px; display:none; font-size:13px }
</style>

<header>
  <h1>Hiring searches</h1>
  <span class="dim">local only &middot; 127.0.0.1 &middot; your X cookies never leave this machine</span>
</header>

<div class="wrap">

  <div class="panel">
    <h2>Your searches</h2>
    <table>
      <thead><tr>
        <th>Name</th><th>Source</th><th>Schedule</th><th>On</th><th>Last run</th><th></th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <div class="panel">
    <h2>Add a search</h2>
    <div class="grid">
      <div><label>Name</label><input id="f-name" placeholder="ai-jobs"></div>
      <div><label>Source</label><select id="f-source">
        <option value="bookmarks">bookmarks (local, free)</option>
        <option value="live">live X search</option>
        <option value="watchlist">watchlist accounts</option>
        <option value="list">X list</option>
      </select></div>
      <div id="w-query"><label>Query (live)</label><input id="f-query" placeholder="hiring OR &quot;open role&quot;"></div>
      <div id="w-handle"><label>Handles (watchlist)</label><input id="f-handles" placeholder="aakashgupta, comma separated"></div>
      <div id="w-list"><label>List id</label><input id="f-list" placeholder="1908587200419422252"></div>
      <div><label>Every N days</label><input id="f-every" type="number" min="1" value="1"></div>
      <div><label>Time</label><input id="f-time" value="09:00"></div>
      <div><label>Look back (days)</label><input id="f-back" type="number" min="1" value="7"></div>
      <div><label>Min likes</label><input id="f-likes" type="number" min="0" value="0"></div>
    </div>
    <div class="row" style="margin-top:12px">
      <button onclick="add()">Add</button>
      <span class="dim" style="font-size:12px">Leave query empty on a live search to use the full 81 phrase set.</span>
    </div>
  </div>

  <div class="panel">
    <h2>Results</h2>
    <div id="results" class="dim">loading...</div>
  </div>

</div>
<div id="msg"></div>

<script>
const SOURCES = ['bookmarks', 'live', 'watchlist', 'list'];
function say(t, bad) {
  const m = document.getElementById('msg');
  m.textContent = t; m.style.display = 'block';
  m.style.borderColor = bad ? '#5a2626' : '#235c4a';
  setTimeout(() => m.style.display = 'none', 2600);
}
async function api(path, body) {
  const r = await fetch(path, body ? {method:'POST', body: JSON.stringify(body)} : {});
  return {status: r.status, data: await r.json().catch(() => ({}))};
}
function show() {
  const src = document.getElementById('f-source').value;
  document.getElementById('w-query').style.display  = src === 'live' ? '' : 'none';
  document.getElementById('w-handle').style.display = src === 'watchlist' ? '' : 'none';
  document.getElementById('w-list').style.display   = src === 'list' ? '' : 'none';
}
document.getElementById('f-source').onchange = show;

async function loadSearches() {
  const {data} = await api('/api/searches');
  const tb = document.getElementById('rows');
  tb.innerHTML = '';
  for (const s of data.searches) {
    const last = (data.state[s.name] || {}).last_run || 'never';
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><strong>${s.name}</strong><br><span class="dim" style="font-size:12px">${esc(s.notes || '')}</span></td>
      <td><span class="pill">${s.source}</span><br><span class="dim mono">${esc(short(s))}</span></td>
      <td>every ${s.every_days || 1}d at ${s.time || '09:00'}</td>
      <td><span class="pill ${s.enabled !== false ? 'on' : 'off'}">${s.enabled !== false ? 'on' : 'off'}</span></td>
      <td class="dim mono">${last}</td>
      <td class="row">
        <button onclick="run('${s.name}')">Run</button>
        <button onclick="toggle('${s.name}')">${s.enabled !== false ? 'Disable' : 'Enable'}</button>
        <button class="danger" onclick="del('${s.name}')">Delete</button>
      </td>`;
    tb.appendChild(tr);
  }
}
function short(s) {
  if (s.query) return s.query.slice(0, 44) + (s.query.length > 44 ? '...' : '');
  if (s.list_id) return 'list ' + s.list_id;
  if (s.handles) return s.handles.length + ' handle(s)';
  if (s.handles_file) return s.handles_file;
  return '';
}
function esc(x){return String(x).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

async function add() {
  const src = document.getElementById('f-source').value;
  const body = {
    name: document.getElementById('f-name').value.trim(),
    source: src,
    every_days: +document.getElementById('f-every').value || 1,
    time: document.getElementById('f-time').value,
    days_back: +document.getElementById('f-back').value || 7,
    min_likes: +document.getElementById('f-likes').value || 0,
  };
  const q = document.getElementById('f-query').value.trim();
  const h = document.getElementById('f-handles').value.trim();
  const l = document.getElementById('f-list').value.trim();
  if (q) body.query = q;
  if (h) body.handles = h.split(',').map(x => x.trim().replace(/^@/, '')).filter(Boolean);
  if (l) body.list_id = l;
  if (!body.name) return say('name is required', true);
  const r = await api('/api/add', body);
  say(r.status === 200 ? 'added ' + body.name : (r.data.error || 'add failed'), r.status !== 200);
  loadSearches();
}
async function toggle(n){ await api('/api/toggle', {name:n}); loadSearches(); }
async function del(n){ if(!confirm('delete ' + n + '?')) return; await api('/api/delete', {name:n}); loadSearches(); }
async function run(n){ say('running ' + n + '...'); const r = await api('/api/run', {name:n});
  say(r.status === 200 ? 'started ' + n : (r.data.error || 'failed'), r.status !== 200);
  setTimeout(loadResults, 4000); }

async function loadResults() {
  const {data} = await api('/api/results');
  const box = document.getElementById('results');
  if (!data.results.length) { box.textContent = 'no runs yet. click Run on a search.'; return; }
  box.innerHTML = '';
  for (const r of data.results) {
    const d = document.createElement('details');
    const c = Object.entries(r.counts).map(([k,v]) => `${k} ${v}`).join('  ');
    d.innerHTML = `<summary><strong>${esc(r.name)}</strong>
      <span class="dim">${esc((r.ran_at||'').slice(0,16).replace('T',' '))} &middot;
      ${r.openings} openings &middot; ${esc(c)}</span></summary>`;
    const list = document.createElement('div');
    for (const t of r.tweets.slice(0, 60)) {
      const e = document.createElement('div');
      e.className = 'tw';
      e.innerHTML = `<div><span class="who">@${esc(t.author_handle)}</span>
        <span class="pill">${esc(t.bucket)}</span>
        ${t.pay && t.pay.length ? '<span class="counts"> ' + esc(t.pay.slice(0,2).join(' ')) + '</span>' : ''}</div>
        <div class="txt">${esc(t.text)}</div><a href="${esc(t.url)}" target="_blank" rel="noopener">open on x</a>`;
      list.appendChild(e);
    }
    d.appendChild(list);
    box.appendChild(d);
  }
}
show(); loadSearches(); loadResults();
</script>
</html>
